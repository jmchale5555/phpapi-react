services:
  db:
    ports:
      - "${DB_PORT_HOST:-3306}:3306"

  php:
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      APP_URL: ${APP_URL_DEV:-http://localhost:8080}
      VITE_DEV_SERVER: ${VITE_DEV_SERVER_DEV:-http://localhost:5173}
    volumes:
      - ./:/var/www/html:z

  nginx:
    volumes:
      - ./:/var/www/html:ro,z
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z

  php_test:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: phpsk-php-test
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: testing
      APP_DEBUG: "true"
      APP_URL: ${TEST_APP_URL:-http://localhost:8081}
      APP_NAME: ${APP_NAME:-PHP SPA Boilerplate}
      APP_DESC: ${APP_DESC:-Reusable PHP API and React SPA starter}
      DB_DRIVER: ${DB_DRIVER:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${TEST_DB_NAME:-phpsk_test}
      DB_USER: ${TEST_DB_USER:-phpsk}
      DB_PASS: ${TEST_DB_PASS:-phpsk_dev_password}
      VITE_DEV_SERVER: ""
    volumes:
      - ./:/var/www/html:z
    depends_on:
      db:
        condition: service_healthy

  node:
    image: ${NODE_IMAGE:-node:20-alpine}
    container_name: phpsk-node
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://nginx}
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html:z
    depends_on:
      - nginx

  nginx_test:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: phpsk-nginx-test
    restart: unless-stopped
    depends_on:
      - php_test
    ports:
      - "${TEST_APP_PORT:-8081}:80"
    volumes:
      - ./:/var/www/html:ro,z
      - ./docker/nginx/default.test.conf:/etc/nginx/conf.d/default.conf:ro,z
