services:
  db:
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    container_name: phpsk-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-phpsk}
      MARIADB_USER: ${DB_USER:-phpsk}
      MARIADB_PASSWORD: ${DB_PASS:-phpsk_dev_password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-phpsk_root_password}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,z
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MARIADB_ROOT_PASSWORD:-phpsk_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: phpsk-php
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_NAME: ${APP_NAME:-PHP SPA Boilerplate}
      APP_DESC: ${APP_DESC:-Reusable PHP API and React SPA starter}
      DB_DRIVER: ${DB_DRIVER:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-phpsk}
      DB_USER: ${DB_USER:-phpsk}
      DB_PASS: ${DB_PASS:-phpsk_dev_password}
      VITE_DEV_SERVER: ${VITE_DEV_SERVER:-}
    volumes:
      - ./:/var/www/html:z
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: phpsk-nginx
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro,z
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z

volumes:
  mariadb_data:
